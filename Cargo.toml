[package]
name = "dime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "DiMe: a 3D disk and memory explorer for macOS. Di maps the disk, Me watches memory, Ru says what can go."

[dependencies]
axum = "0.8.9"
libc = "0.2"
notify = "8.2.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
