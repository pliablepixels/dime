[package]
name = "dume"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
notify = "8.2.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
