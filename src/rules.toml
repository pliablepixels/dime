# DiMe's built-in rules: how Di decides what can go.
#
# Copy this to ~/.dime/rules.toml and edit. Your rules are tried first, then these;
# the first rule that matches wins, and a matched folder is not searched inside.
# Edits take effect on the next Rescan. `dime --rules` prints this file.
#
# Every field except id/tier/what/note is a matcher; all given matchers must hold.
#   id                 groups items in the Cleanup panel (same id on two rules = one group)
#   tier               safe | likely | review | note
#                      the first three are recommendations. "note" is not: it is shown as inventory,
#                      kept out of the headline totals, and never suggested for removal
#   what               heading shown in the panel
#   note               one line under each item; {idle} = "Idle 4 months.", {age} = "4 months"
#   weight             score multiplier, bigger floats to the top (default 1.0)
#   dir                true = folders only, false = files only, omit = either
#   name               exact names, any of
#   ext                file extensions, any of (lower-case, no dot)
#   parent_ends_with   the folder holding it ends with one of these, e.g. "Developer/Xcode"
#                      with no `name`, this matches every child of that folder, which is how you flag
#                      one OS version or one simulator instead of the whole tree that holds them
#   under              some ancestor folder has this name, e.g. "Downloads"
#   has_child          the folder directly contains one of these names
#   has_sibling        one of these names sits beside it, in the same folder
#   no_sibling         none of these names sits beside it. With has_sibling this separates a cache
#                      a command will rebuild from an orphan whose project is gone
#   min_size           "20 MB", "1 GB" or bytes; items under 1 MB are never listed
#   min_age_days       untouched (no read or write) for at least this many days
#   descend            true = this is a container, not a candidate: keep walking inside it. Without
#                      this, a rule that names a folder hides every finer rule underneath it
#   git_ignored        true = only match when the project itself ignores this folder, i.e. it is
#                      output rather than something somebody ships. Outside a git repo there is no
#                      such signal and the matcher stands aside
#   app_gone           true = only match a folder named for an application bundle identifier that
#                      nothing installed here publishes: what an uninstall left behind. Matched at
#                      the vendor rather than the exact identifier, and never for Apple's own
#
# disable = ["downloads", "stale"]   # in your file: switch built-in ids off

# Anything a running program holds open drops to this tier, whatever its rule decided: a cache
# being written to right now is not safe to move. Set to "" to switch the check off.
open_tier = "review"

# ---- folders ----

# A cache with its project still beside it is rebuilt by one command. The same folder with the
# project gone is an orphan: nothing will ever rebuild it, and nothing still needs it.
# A virtualenv is the one cache that can hold work nothing recorded: `pip install` typed by hand
# leaves no lock file, so with no manifest beside it there is no command that puts the env back.
# Same folder with a manifest is rebuilt in one command and falls through to "cache" below.
[[rule]]
id = "venv-nolock"
tier = "review"
what = "Virtualenvs with nothing to rebuild them from"
note = "No lock or requirements file beside it, so nothing records what is installed here. Run `pip freeze > requirements.txt` first if you want it back. {idle}"
weight = 1.4
dir = true
name = [".venv", "venv", ".virtualenv", "env"]
no_sibling = ["pyproject.toml", "requirements.txt", "requirements.in", "setup.py", "setup.cfg", "Pipfile", "Pipfile.lock", "poetry.lock", "uv.lock", "environment.yml", "conda.yaml"]
min_size = "20 MB"

[[rule]]
id = "orphan-cache"
tier = "safe"
what = "Caches whose project is gone"
note = "Nothing beside it builds this any more. Nothing will rebuild it either. {idle}"
weight = 3.2
dir = true
name = ["node_modules", "target", "Pods", ".next", ".turbo", ".nuxt", ".dart_tool", ".angular", "bower_components"]
no_sibling = ["package.json", "Cargo.toml", "pyproject.toml", "requirements.txt", "Podfile", "pubspec.yaml", "angular.json", "go.mod", "Gemfile", "setup.py"]

[[rule]]
id = "cache"
tier = "safe"
what = "Build & dependency caches"
note = "Recreated the next time you build or install."
weight = 3.0
dir = true
name = ["node_modules", "target", ".venv", "venv", "__pycache__", ".gradle", ".npm", ".pnpm-store", ".m2",
        "Pods", ".next", ".turbo", ".tox", ".mypy_cache", ".pytest_cache", ".parcel-cache", ".nuxt",
        "DerivedData", ".cargo-cache", "bower_components", ".dart_tool", ".angular"]

# Containers, named only so the walk carries on past them. A cache folder holding a dozen model
# stores is not itself a thing anyone removes, and claiming it here would hide everything below.
[[rule]]
id = "container"
tier = "note"
what = "Container"
note = ""
descend = true
dir = true
# Only folders with a finer rule underneath belong here. A name listed with nothing below it to
# match is not a container, it is a blind spot: the walk passes through and the bytes go unclaimed.
name = ["huggingface", "lm-studio", "lmstudio", "hub", "models", "blobs", "manifests",
        "nomic.ai", "jan", "GPT4All", "Ollama", "LM Studio", "datasets"]

# ---- models and agents ----
# Weights are the biggest thing on a developer's disk now, and they arrive in a dozen places. Each
# store is broken into the unit people recognise: one model, not the whole cache. Ollama is the
# exception, because it stores weights by content hash; DiMe reads its manifests and puts the model
# name back on the row.

[[rule]]
id = "ollama-model"
tier = "review"
what = "Ollama models"
note = "Pulled again on demand, unless you built it yourself with `ollama create`, in which case nothing will. {idle}"
weight = 1.4
dir = false
parent_ends_with = ".ollama/models/blobs"
min_size = "200 MB"
# Ollama keeps its own index. Unlink a blob and `ollama ls` still lists the model, so let Ollama do it.
remove_with = "ollama rm {model}"

[[rule]]
id = "hf-model"
tier = "review"
what = "Hugging Face models"
note = "Downloaded weights. Fetched again the next time something asks for them. {idle}"
weight = 1.3
dir = true
parent_ends_with = "huggingface/hub"
min_size = "50 MB"

# The hub's newer chunk store. Pure cache: every chunk came down with a model and comes down
# again. It sits beside hub rather than under .cache, so the generic cache rule never sees it.
[[rule]]
id = "hf-xet"
tier = "safe"
what = "Hugging Face chunk cache"
note = "Chunks the hub downloaded alongside your models. Fetched again with them. {idle}"
weight = 2.6
dir = true
name = ["xet"]
under = "huggingface"
min_size = "20 MB"

[[rule]]
id = "hf-datasets"
tier = "review"
what = "Hugging Face datasets"
note = "Downloaded datasets. Fetched again on demand. {idle}"
weight = 1.3
dir = true
parent_ends_with = "huggingface/datasets"
min_size = "50 MB"

[[rule]]
id = "lmstudio-model"
tier = "review"
what = "LM Studio models"
note = "Downloaded weights. Re-downloadable from LM Studio. {idle}"
weight = 1.3
dir = true
under = "lmstudio"
parent_ends_with = "models"
min_size = "50 MB"

# Deliberately not .ollama or .lmstudio: those have rules above that break them into single models,
# and naming the store here would stop the walk before it ever reached them.
[[rule]]
id = "models"
tier = "review"
what = "AI models"
note = "Downloaded model weights. Pulled again automatically if you use them. {idle}"
weight = 1.2
dir = true
name = ["mlx_models", "gguf"]
min_size = "100 MB"

# The rest of the field keeps weights in readable folders, so they only need naming here, not
# decoding. Each is broken at the level of one model or one checkpoint.
[[rule]]
id = "gpt4all-model"
tier = "review"
what = "GPT4All models"
note = "Downloaded weights. Re-downloadable in GPT4All. {idle}"
weight = 1.3
dir = false
ext = ["gguf", "bin"]
under = "nomic.ai"
min_size = "200 MB"

[[rule]]
id = "jan-model"
tier = "review"
what = "Jan models"
note = "Downloaded weights. Re-downloadable in Jan. {idle}"
weight = 1.3
dir = true
parent_ends_with = "jan/models"
min_size = "200 MB"

[[rule]]
id = "diffusion-model"
tier = "review"
what = "Image model checkpoints"
note = "A downloaded checkpoint is fetched again; one your own training produced is not, and this cannot tell them apart. {idle}"
weight = 1.3
dir = false
ext = ["safetensors", "ckpt", "pt", "pth", "gguf"]
min_size = "500 MB"

[[rule]]
id = "llamacpp-model"
tier = "review"
what = "llama.cpp models"
note = "A GGUF weight file. {idle}"
weight = 1.3
dir = false
ext = ["gguf"]
min_size = "200 MB"

# Read before "run-output": a folder called checkpoints inside a cache holds weights something
# downloaded, not the result of a run on this machine. Without this the two are indistinguishable
# by name, and torch's own `hub/checkpoints` gets described as work no download can bring back.
[[rule]]
id = "torch-cache"
tier = "likely"
what = "Model caches"
note = "Weights a library downloaded into its cache. Fetched again on demand. {idle}"
weight = 1.5
dir = true
name = ["checkpoints"]
under = [".cache", "Caches"]
min_size = "50 MB"

# Before every cache rule: an embedding store is a database that happens to live in a cache folder.
# Rebuilding it means paying for the embeddings again, and if the documents it was built from have
# moved on, it cannot be rebuilt at all. Never a suggestion.
[[rule]]
id = "vector-store"
tier = "note"
what = "Vector stores"
note = "Embeddings, not a cache. Rebuilding means embedding every document again, and only if you still have them. {idle}"
weight = 1.0
dir = true
name = ["chroma", "chroma_db", ".chroma", "chromadb", "lancedb", ".lancedb", "qdrant_storage", "milvus", "weaviate", "faiss_index", "vectorstore", "vector_store", "pgdata"]
min_size = "20 MB"

# What a training or fine-tuning run produced. Nothing on the internet has a copy.
[[rule]]
id = "run-output"
tier = "note"
what = "Training runs & checkpoints"
note = "Output of a run on this machine, not something downloaded: no re-download will bring it back. {idle}"
weight = 1.0
dir = true
name = ["checkpoints", "checkpoint", "ckpt", "runs", "wandb", "mlruns", "lora", "loras", "adapters", "finetune", "fine_tune", "outputs"]
min_size = "50 MB"

# The same thing one level up: libraries that keep their downloads in a dot-folder of their own
# instead of under .cache. Adding another is adding a word.
[[rule]]
id = "torch-cache"
tier = "likely"
what = "Model caches"
note = "Weights a library downloaded for itself. Fetched again on demand. {idle}"
weight = 1.5
dir = true
name = [".insightface", ".keras", ".paddle", ".deepface", ".u2net", ".EasyOCR", ".fastai", ".modelscope",
        ".triton", ".nv", ".vllm", ".pyannote", ".torch", ".timm", ".stanza_resources", ".allennlp"]
min_size = "50 MB"

# A weight folder somebody curated by hand is not a cache: ComfyUI's checkpoints, LoRAs and VAEs
# are dropped there one at a time and only some of them are still downloadable.
[[rule]]
id = "comfyui-model"
tier = "review"
what = "ComfyUI models"
note = "Weights ComfyUI loads from. Some were downloaded, some were put here by hand, and nothing on disk says which. {idle}"
weight = 1.2
dir = true
parent_ends_with = "ComfyUI/models"
min_size = "100 MB"

[[rule]]
id = "torch-cache"
tier = "likely"
what = "Model caches"
note = "Weights and checkpoints a library downloaded for itself. Fetched again on demand. {idle}"
weight = 1.5
dir = true
name = ["torch", "whisper", "mlx", "sentence_transformers", "transformers", "timm", "open_clip", "clip",
        "llama_index", "onnx", "diffusers", "spacy", "flair", "gdown", "kagglehub"]
under = ".cache"
min_size = "100 MB"

[[rule]]
id = "agent-sessions"
tier = "note"
what = "Agent transcripts & memory"
note = "Everything a coding agent remembers: past sessions, and what resuming one reads back. Nothing regenerates it. {idle}"
weight = 1.0
dir = true
name = ["projects", "sessions", "file-history", "history", "todos", "memory"]
# every coding agent DiMe knows about; adding another is adding a word
under = [".claude", ".codex", ".gemini", ".cursor", ".aider", ".continue", ".opencode", ".amp", ".goose", ".windsurf"]
min_size = "20 MB"

# The disposable half of the same folders: caches and snapshots an agent rebuilds by itself.
[[rule]]
id = "agent-scratch"
tier = "likely"
what = "Agent caches & snapshots"
note = "Working files a coding agent rebuilds on its own. No conversation lives here. {idle}"
weight = 1.5
dir = true
name = ["shell-snapshots", "statsig", "cache", "logs", "tmp", "downloads"]
under = [".claude", ".codex", ".gemini", ".cursor", ".aider", ".continue", ".opencode", ".amp", ".goose", ".windsurf"]
min_size = "20 MB"

[[rule]]
id = "browser-bundles"
tier = "likely"
what = "Headless browsers"
note = "Browsers a test runner downloaded for itself. Re-downloaded on demand. {idle}"
weight = 1.6
dir = true
name = ["ms-playwright", "ms-playwright-go", "puppeteer", "Chromium", "chrome"]
under = "Caches"
min_size = "100 MB"

# ---- what uninstalling leaves behind ----
# Dragging an app to the Trash takes the app. Everything it wrote under Library stays, and on a
# machine a few years old that is the largest single pile of dead weight on the disk. A folder
# named for a bundle identifier is the one leftover that can be identified rather than guessed:
# see `app_gone` in gunk.rs, which only answers for a reverse-DNS name, never for Apple's own, and
# matches at the vendor so a helper or a renamed version still counts as installed. Reviewed rather
# than safe: an app living somewhere DiMe did not look would read as uninstalled.
# Everything an uninstall leaves under Library that still has the app's documents and settings in
# it. One rule for all three folders, because they want the same answer and the same warning.
[[rule]]
id = "app-leftover"
tier = "review"
what = "Left behind by apps you removed"
note = "Nothing installed on this machine publishes this identifier, so this is what an uninstall left behind, settings and documents included. Background helpers sometimes ship without an app of their own, so give the name a look before it goes. {idle}"
weight = 2.0
dir = true
app_gone = true
parent_ends_with = ["Application Support", "Containers", "Group Containers"]
min_size = "20 MB"
min_age_days = 7

[[rule]]
id = "app-leftover"
tier = "likely"
what = "Left behind by apps you removed"
note = "The cache of an app that is not installed any more, so nothing will ever read it again. {idle}"
weight = 2.2
dir = true
app_gone = true
parent_ends_with = "Caches"
min_size = "20 MB"
min_age_days = 7

[[rule]]
id = "app-leftover"
tier = "likely"
what = "Left behind by apps you removed"
note = "Web storage of an app that is not installed any more. {idle}"
weight = 2.0
dir = true
app_gone = true
under = ["HTTPStorages", "WebKit", "Saved Application State", "Application Scripts"]
min_size = "10 MB"
min_age_days = 7

# Window positions and untitled documents macOS reopens for you. Every app writes it again the
# next time it quits, and an app that never runs again has no use for it either way.
[[rule]]
id = "saved-state"
tier = "safe"
what = "Reopen-window state"
note = "What macOS reopens an app's windows from. Written again every time the app quits."
weight = 2.4
dir = true
name = ["Saved Application State"]
min_size = "20 MB"

# Crash logs. Apple already has the ones it wanted.
[[rule]]
id = "crashlogs"
tier = "safe"
what = "Crash & diagnostic reports"
note = "Reports about crashes that already happened. Nothing reads them back."
weight = 2.4
dir = true
name = ["DiagnosticReports", "CrashReporter", "CoreSimulator", "Feedback"]
under = ["Logs", "Application Support"]
min_size = "20 MB"

# Updaters keep the installer after installing from it, and none of them ever come back for it.
[[rule]]
id = "update-leftovers"
tier = "safe"
what = "Finished updates"
note = "Downloaded and already installed. Updaters fetch a fresh copy next time rather than reusing this. {idle}"
weight = 2.4
dir = true
name = ["Updates", "updates", "SoftwareUpdate", "PKInstallSandboxManager", "com.apple.SoftwareUpdate"]
under = ["Library"]
min_size = "50 MB"

[[rule]]
id = "ios-updates"
tier = "likely"
what = "iOS & iPadOS update files"
note = "A downloaded device update, already applied or long superseded. Finder fetches it again if it ever needs it. {idle}"
weight = 2.0
dir = false
ext = ["ipsw"]
min_size = "100 MB"

# Mail keeps every attachment you ever opened, separately from the message it came with.
[[rule]]
id = "mail-downloads"
tier = "review"
what = "Mail attachments"
note = "Attachments Mail saved when you opened them. The messages still hold their own copies, so these are duplicates, but anything you dragged out of Mail and never filed lives only here. {idle}"
weight = 1.4
dir = true
name = ["Mail Downloads", "MailDownloads", "Mail Attachments"]
min_size = "50 MB"

# Read before the app-cache rule below. Poetry puts whole virtualenvs under Caches, and the
# generic rule there would call them safe. They rebuild from a lock file, but not instantly, and
# not at all for a project whose lock has moved on.
[[rule]]
id = "poetry-venv"
tier = "review"
what = "Poetry virtualenvs"
note = "Whole environments, not downloads. `poetry install` rebuilds one from its lock file, which takes a while and needs the project still around. {idle}"
weight = 1.2
dir = true
name = ["pypoetry", "virtualenvs", "pyenv", "conda", "miniconda3", "anaconda3"]
parent_ends_with = "Caches"
min_size = "50 MB"

# A cache folder is a container: one per app inside it, and that is the unit worth showing. Naming
# the container instead would stop the walk before it reached any of the rules above.
[[rule]]
id = "appcache"
tier = "safe"
what = "App caches"
note = "One app's cache. It rebuilds what it needs, and may start slower once. {idle}"
weight = 2.5
dir = true
parent_ends_with = ["Caches", ".cache"]
min_size = "20 MB"

[[rule]]
id = "appcache"
tier = "safe"
what = "App caches"
note = "Apps rebuild this as needed. Some may start slower once."
weight = 2.4
dir = true
name = ["CachedData", "Code Cache", "GPUCache", "ShaderCache"]
min_size = "20 MB"

# The two rules below match the *children* of a folder rather than the folder itself, because that is
# where the removable thing lives: one OS version, one simulator. Flagging the folder holding them
# would offer tens of gigabytes as a single all-or-nothing row, and would also stop the walk from ever
# reaching the good rules underneath it. Use parent_ends_with with no name to say "each child of".
#
# Neither carries min_age_days on purpose. One of these is a unit whether or not it was touched
# lately, and matching it is also what stops the walk from wandering into a simulator's own caches
# and app containers, where nothing is worth removing on its own. Reading the age off a folder is
# unreliable anyway: simply measuring it updates the access time.

[[rule]]
id = "devicesupport"
tier = "likely"
what = "Device support files"
note = "Debug symbols for one OS version. Xcode fetches them again the next time you attach a device running it. {idle}"
weight = 2.0
dir = true
parent_ends_with = "DeviceSupport"
min_size = "200 MB"

[[rule]]
id = "simulator-device"
tier = "review"
what = "Simulator devices"
note = "One simulator, with everything installed on it. Deleting it is like erasing that device. {idle}"
dir = true
parent_ends_with = "CoreSimulator/Devices"
min_size = "200 MB"

[[rule]]
id = "trash"
tier = "safe"
what = "Already in the Trash"
note = "Empty the Trash to get this space back."
weight = 3.0
dir = true
name = [".Trash"]

[[rule]]
id = "backups"
tier = "review"
what = "iPhone & iPad backups"
note = "Device backups. Remove old ones in Finder > device > Manage Backups."
weight = 1.2
dir = true
name = ["Backup"]
parent_ends_with = "MobileSync"

[[rule]]
id = "archives"
tier = "review"
what = "Xcode archives"
note = "Old app builds. Keep only ones you still ship."
weight = 1.2
dir = true
name = ["Archives"]
parent_ends_with = "Developer/Xcode"

# Package manager stores. Each is re-downloadable, and each is also hard-linked into every
# project that uses it, so the row says what removing it really frees (see "shared" in gunk.rs).
[[rule]]
id = "pkg-store"
tier = "likely"
what = "Package manager stores"
note = "Downloaded packages, fetched again on the next install. {idle}"
weight = 1.7
dir = true
name = ["registry", "git", "store", "cache"]
under = [".cargo", "pnpm", ".bun", ".deno", ".yarn"]
min_size = "100 MB"

[[rule]]
id = "toolchain"
tier = "likely"
what = "Installed toolchains"
note = "One toolchain. `rustup toolchain install` puts it back. {idle}"
weight = 1.6
dir = true
parent_ends_with = ".rustup/toolchains"
min_size = "100 MB"

# An editor's local history is the undo that outlives the editor: edits it kept that were never
# committed anywhere. Inventory only, like the agent transcripts above.
[[rule]]
id = "editor-history"
tier = "note"
what = "Editor local history"
note = "Versions of your files the editor kept outside git. Nothing regenerates them. {idle}"
weight = 1.0
dir = true
name = ["History", "LocalHistory"]
under = ["Code", "Code - Insiders", "Cursor", "Windsurf", "VSCodium", "JetBrains"]
min_size = "20 MB"

# The rest of the VM field. Docker.raw has its own rule below; these keep their disks in a folder.
[[rule]]
id = "diskimage"
tier = "review"
what = "VM & disk images"
note = "A virtual machine's disk. Delete only if the VM is gone: everything installed inside it goes too. {idle}"
weight = 1.2
dir = true
name = [".colima", ".lima", ".orbstack", ".docker", ".vagrant.d", "vmware", "Parallels"]
min_size = "1 GB"

# `git_ignored` is what separates output from a deliverable. A `dist` the repo ignores is written
# again by the next build; a `dist` the repo tracks is the thing somebody ships. Outside a repo
# there is no signal either way and the rule behaves as it always has.
[[rule]]
id = "build"
tier = "likely"
what = "Build output"
note = "Ignored by the project itself, so the next build writes it again."
weight = 1.5
dir = true
name = ["build", "dist", "out", ".build", "target", "bin", "obj", "coverage", ".output"]
git_ignored = true
min_size = "20 MB"

[[rule]]
id = "logs"
tier = "likely"
what = "Logs"
note = "Apps write fresh logs. Old ones are rarely needed."
weight = 1.5
dir = true
name = ["Logs"]
min_size = "50 MB"

[[rule]]
id = "project"
tier = "review"
what = "Untouched projects"
note = "No changes in {age}. Archive it or delete it."
dir = true
has_child = ["package.json", "Cargo.toml", "pyproject.toml", "go.mod", "Gemfile", "pom.xml", "build.gradle", "Package.swift", ".git"]
min_size = "50 MB"
min_age_days = 181

# ---- files ----
# Possible duplicates (same name and size as another file of 5 MB or more) are found before these; that check is built in.

[[rule]]
id = "simruntime"
tier = "review"
what = "Simulator runtimes"
note = "One installed simulator runtime, and it may be mounted right now. Remove it in Xcode under Settings > Platforms rather than deleting the file."
dir = false
ext = ["dmg"]
parent_ends_with = "CoreSimulator/Images"
min_size = "100 MB"

[[rule]]
id = "diskimage"
tier = "review"
what = "VM & disk images"
note = "Docker Desktop's disk. Shrink it from Docker's settings, not by deleting."
dir = false
name = ["Docker.raw"]

[[rule]]
id = "diskimage"
tier = "review"
what = "VM & disk images"
note = "Virtual disk. Delete only if the VM is gone. {idle}"
dir = false
ext = ["qcow2", "vmdk", "vdi", "vhd", "vhdx", "img", "raw", "sparseimage", "sparsebundle", "diffdisk"]
min_size = "100 MB"

# Parallels, VMware and UTM keep a VM in a folder whose name carries the extension.
[[rule]]
id = "diskimage"
tier = "review"
what = "VM & disk images"
note = "A whole virtual machine. Delete only if you are done with it: nothing brings back what was installed inside. {idle}"
dir = true
ext = ["pvm", "vmwarevm", "utm", "qvm"]
min_size = "100 MB"

[[rule]]
id = "installer"
tier = "likely"
what = "Installers & archives"
note = "Usually done with once installed or extracted. {idle}"
weight = 1.8
dir = false
ext = ["dmg", "pkg", "iso", "zip", "tgz", "gz", "xz", "bz2", "7z", "rar", "msi", "exe", "ipa", "apk"]
min_size = "5 MB"
min_age_days = 8

[[rule]]
id = "downloads"
tier = "likely"
what = "Old downloads"
note = "Sitting in Downloads. {idle}"
weight = 1.8
dir = false
under = "Downloads"
min_age_days = 31

[[rule]]
id = "logs"
tier = "likely"
what = "Logs"
note = "Apps write fresh logs. {idle}"
weight = 1.5
dir = false
ext = ["log", "crash"]
min_size = "10 MB"

# The two below are inventory, not advice: "you own a big file" is not a reason to remove it. They
# sit in the note tier so they stay out of the headline, and their floors are high enough that the
# list stays readable rather than running to hundreds of rows.
[[rule]]
id = "large"
tier = "note"
what = "Largest files"
note = "Not a suggestion, just the biggest things here. {idle}"
dir = false
min_size = "1 GB"

[[rule]]
id = "stale"
tier = "note"
what = "Big and long untouched"
note = "Not a suggestion. Nothing has read or written it in {age}."
dir = false
min_size = "200 MB"
min_age_days = 365
